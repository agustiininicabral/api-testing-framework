name: API Integration Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run integration tests against configured API
        run: python -m pytest -v -m integration --junitxml=integration-report.xml

      - name: Upload integration test report
        if: always() && hashFiles('integration-report.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: integration-report.xml
          if-no-files-found: warn
          retention-days: 7
